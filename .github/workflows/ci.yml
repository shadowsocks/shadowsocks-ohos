name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Rust core is a path dependency on the shadowsocks-rust checkout that
  # the Android app builds (see native/sslocal-ffi/Cargo.toml). Keep this in
  # step with the `core/src/main/rust/shadowsocks-rust` submodule pin in
  # shadowsocks-android, so both platforms ship the same core.
  SHADOWSOCKS_RUST_REF: v1.23.4
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can run without the HarmonyOS SDK: the Rust core's unit
  # tests, both host e2e tunnels, the OpenHarmony cross-compile check and the
  # tun packet-routing e2e. The ArkTS unit tests and the HAP build are not
  # covered — they need the DevEco command-line tools, which are not publicly
  # downloadable (see docs/hos-emulator-vpn.md); run them locally with
  # `hvigorw test` / `hvigorw assembleHap`.
  core:
    name: Core tests, e2e tunnels and tun routing
    runs-on: ubuntu-latest
    # Generous for a cold cache: clippy and the three test-e2e-host.sh steps
    # each build shadowsocks-service (different profiles/targets).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out the shared Rust core
        run: |
          # Cargo.toml path-depends on ../../../core/... relative to
          # native/sslocal-ffi, which is a *sibling* of this checkout — the
          # layout this subproject has inside shadowsocks-android.
          core_dir="$(dirname "$GITHUB_WORKSPACE")/core/src/main/rust"
          mkdir -p "$core_dir"
          git clone --depth 1 --branch "$SHADOWSOCKS_RUST_REF" \
            https://github.com/shadowsocks/shadowsocks-rust.git \
            "$core_dir/shadowsocks-rust"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos
          components: clippy, rustfmt

      # C cross-compiler for the OpenHarmony check below: the OHOS native SDK
      # is not publicly downloadable, so native/ohos-cc-wrapper.sh shims the C
      # bits (blake3) through `zig cc` against the equivalent musl target.
      - uses: mlugg/setup-zig@v2

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/sslocal-ffi/target
          key: cargo-${{ runner.os }}-${{ env.SHADOWSOCKS_RUST_REF }}-${{ hashFiles('native/sslocal-ffi/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.SHADOWSOCKS_RUST_REF }}-

      - name: rustfmt
        working-directory: native/sslocal-ffi
        run: cargo fmt --all -- --check

      # --no-deps: shadowsocks-rust is a path dependency and would otherwise be
      # linted too, failing on upstream warnings this repo cannot fix.
      - name: clippy
        working-directory: native/sslocal-ffi
        run: cargo clippy --no-deps --all-targets -- -D warnings

      # test-e2e-host.sh skips the tun e2e when the device is absent. In CI
      # that must be a hard failure instead: it is the only test that drives
      # real IP packets through the tun stack.
      - name: Assert the runner can create tun devices
        run: test -c /dev/net/tun

      - name: Core verification (unit + e2e + cross-compile + tun routing)
        run: ./test-e2e-host.sh
